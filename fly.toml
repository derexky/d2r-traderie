app = 'd2r-traderie'
primary_region = 'sin'

[build]

[env]
  PORT = '7432'

[mounts]
  source = 'chrome_data'
  destination = '/data'

[http_service]
  internal_port = 7432
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
